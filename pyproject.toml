[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxlake"
version = "0.1.0"
description = "Durable transaction outbox to Parquet lakehouse"
requires-python = ">=3.12,<3.16"
dependencies = ["fastapi==0.162.0", "starlette==1.3.1", "uvicorn==0.38.0", "pyarrow==26.0.0", "duckdb==2.0.0", "psycopg[binary]==3.3.6", "filelock==4.2.1", "prometheus-client==0.23.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.3", "pip-audit==2.9.0"]

[project.scripts]
fluxlake = "fluxlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: needs TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
